name: Build and vendor offline JBIG2 for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-jbig2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up CMake toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'vcpkg is not installed on runner' }
          git clone --depth 1 https://github.com/agl/jbig2enc.git "$env:RUNNER_TEMP/jbig2enc"
          vcpkg install leptonica:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'Leptonica build failed' }
          cmake -S "$env:RUNNER_TEMP/jbig2enc" -B "$env:RUNNER_TEMP/jbig2-build" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build "$env:RUNNER_TEMP/jbig2-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'JBIG2 compilation failed' }
          $exe = Get-ChildItem "$env:RUNNER_TEMP/jbig2-build" -Filter 'jbig2.exe' -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Built jbig2.exe not found' }
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item $exe.FullName bin/jbig2.exe
          $bytes = [IO.File]::ReadAllBytes('bin/jbig2.exe')
          if ($bytes.Length -lt 10000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Built binary invalid' }
          & ./bin/jbig2.exe -h 2>&1 | Out-Host
          $hash = (Get-FileHash bin/jbig2.exe -Algorithm SHA256).Hash
          $sourceSha = git -C "$env:RUNNER_TEMP/jbig2enc" rev-parse HEAD
          "Source: https://github.com/agl/jbig2enc | Commit: $sourceSha | SHA256: $hash | Toolchain: MSVC x64 static vcpkg" | Set-Content bin/SOURCE.txt -Encoding utf8
      - name: Commit offline binary and provenance
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/jbig2.exe bin/SOURCE.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No changes'; exit 0 }
          git commit -m 'Bundle locally built JBIG2 for offline Windows use'
          git pull --rebase origin main
          git push origin HEAD:main
