name: Vendor offline JBIG2 encoder
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-jbig2.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch standalone Windows encoder and commit to repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $release = Invoke-RestMethod -Headers @{ Accept='application/vnd.github+json'; Authorization="Bearer $env:GH_TOKEN" } -Uri 'https://api.github.com/repos/unpins/jbig2/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'windows|win64|x86_64.*exe|amd64.*exe' } | Select-Object -First 1
          if (-not $asset) { throw 'No Windows encoder asset in release; do not commit unverified binary.' }
          New-Item -ItemType Directory -Force bin | Out-Null
          $download = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $download
          if ($asset.name.EndsWith('.zip')) {
            $tmp = Join-Path $env:RUNNER_TEMP 'jbig2-package'
            Expand-Archive -Path $download -DestinationPath $tmp
            $exe = Get-ChildItem $tmp -Filter 'jbig2.exe' -Recurse | Select-Object -First 1
            if (-not $exe) { throw 'ZIP does not contain jbig2.exe' }
            Copy-Item $exe.FullName bin/jbig2.exe
          } elseif ($asset.name.EndsWith('.exe')) {
            Copy-Item $download bin/jbig2.exe
          } else { throw 'Unexpected release file format' }
          $bytes = [IO.File]::ReadAllBytes('bin/jbig2.exe')
          if ($bytes.Length -lt 10000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows executable' }
          & ./bin/jbig2.exe -h 2>&1 | Out-Host
          $hash = (Get-FileHash bin/jbig2.exe -Algorithm SHA256).Hash
          "Upstream release: $($release.tag_name), file: $($asset.name), SHA256: $hash" | Set-Content bin/SOURCE.txt -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bin/jbig2.exe bin/SOURCE.txt
          git commit -m 'Vendor portable JBIG2 Windows encoder for offline use'
          git push
