name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m compileall -q app.py app_v3.py engine.py cli.py jbig2_backend.py
      - run: python -m pytest -q
      - name: Build with locally supplied offline JBIG2 binary when present
        shell: pwsh
        run: |
          if (Test-Path "bin/jbig2.exe") {
            pyinstaller --noconfirm --onefile --windowed --name PDF-Slimmer --add-binary "bin/jbig2.exe;bin" app_v3.py
          } else {
            pyinstaller --noconfirm --onefile --windowed --name PDF-Slimmer app.py
            Write-Warning "JBIG2 binary not provided; EXE will not have JBIG2 compression until the binary is supplied."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Slimmer-Windows
          path: dist/PDF-Slimmer.exe
